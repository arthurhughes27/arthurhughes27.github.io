name: Check links

# Fails a pull request if any local link in the sources or the built pages
# points to a file that does not exist (case-sensitive, like GitHub Pages).
on:
  pull_request:
  push:
    branches: [main]

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - run: Rscript scripts/check_links.R
