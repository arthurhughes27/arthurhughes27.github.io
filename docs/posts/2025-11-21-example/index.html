<script type="application/javascript">

  window.headroom_prevent_pin = false;

  window.document.addEventListener("DOMContentLoaded", function (event) {

    // initialize headroom for banner
    var header = $('header').get(0);
    var headerHeight = header.offsetHeight;
    var headroom = new Headroom(header, {
      tolerance: 5,
      onPin : function() {
        if (window.headroom_prevent_pin) {
          window.headroom_prevent_pin = false;
          headroom.unpin();
        }
      }
    });
    headroom.init();
    if(window.location.hash)
      headroom.unpin();
    $(header).addClass('headroom--transition');

    // offset scroll location for banner on hash change
    // (see: https://github.com/WickyNilliams/headroom.js/issues/38)
    window.addEventListener("hashchange", function(event) {
      window.scrollTo(0, window.pageYOffset - (headerHeight + 25));
    });

    // responsive menu
    $('.distill-site-header').each(function(i, val) {
      var topnav = $(this);
      var toggle = topnav.find('.nav-toggle');
      toggle.on('click', function() {
        topnav.toggleClass('responsive');
      });
    });

    // nav dropdowns
    $('.nav-dropbtn').click(function(e) {
      $(this).next('.nav-dropdown-content').toggleClass('nav-dropdown-active');
      $(this).parent().siblings('.nav-dropdown')
         .children('.nav-dropdown-content').removeClass('nav-dropdown-active');
    });
    $("body").click(function(e){
      $('.nav-dropdown-content').removeClass('nav-dropdown-active');
    });
    $(".nav-dropdown").click(function(e){
      e.stopPropagation();
    });
  });
</script>

                y += elem.offsetTop;
            }

            return { left: x, top: y };
        }
        // https://developer.mozilla.org/en-US/docs/Web/API/HTMLElement/offsetTop
        const bbox = node.getBoundingClientRect();
        const offset = calcOffset(node);
        this.show([offset.left + bbox.width, offset.top + bbox.height]);
      }
    })

    // clear polling timer
    clearInterval(tid);

    // show body now that everything is ready
    on_load_complete();
  }

  var tid = setInterval(distill_post_process, 50);
  distill_post_process();

}

function init_downlevel() {

  init_common();

   // insert hr after d-title
  $('.d-title').after($('<hr class="section-separator"/>'));

  // check if we have authors
  var front_matter = JSON.parse($("#distill-front-matter").html());
  var have_authors = front_matter.authors && front_matter.authors.length > 0;

  // manage byline/border
  if (!have_authors)
    $('.d-byline').remove();
  $('.d-byline').after($('<hr class="section-separator"/>'));
  $('.d-byline a').remove();

  // remove toc
  $('.d-contents').remove();

  // move appendix elements
  $('h1.appendix, h2.appendix').each(function(i, val) {
    $(this).changeElementType('h3');
  });
  $('h3.appendix').each(function(i, val) {
    $(this).nextUntil($('h1, h2, h3')).addBack().appendTo($('.d-appendix'));
  });


  // inject headers into references and footnotes
  var refs_header = $('<h3></h3>');
  refs_header.text('References');
  $('#refs').prepend(refs_header);

  var footnotes_header = $('<h3></h3');
  footnotes_header.text('Footnotes');
  $('.footnotes').children('hr').first().replaceWith(footnotes_header);

  // move appendix-bottom entries to the bottom
  $('.appendix-bottom').appendTo('.d-appendix').children().unwrap();
  $('.appendix-bottom').remove();

  // remove appendix if it's empty
  if ($('.d-appendix').children().length === 0)
    $('.d-appendix').remove();

  // prepend separator above appendix
  $('.d-appendix').before($('<hr class="section-separator" style="clear: both"/>'));

  // trim code
  $('pre>code').each(function(i, val) {
    $(this).html($.trim($(this).html()));
  });

  // move posts-container right before article
  $('.posts-container').insertBefore($('.d-article'));

  $('body').addClass('downlevel');

  on_load_complete();
}


function init_common() {

  // jquery plugin to change element types
  (function($) {
    $.fn.changeElementType = function(newType) {
      var attrs = {};

      $.each(this[0].attributes, function(idx, attr) {
        attrs[attr.nodeName] = attr.nodeValue;
      });

      this.replaceWith(function() {
        return $("<" + newType + "/>", attrs).append($(this).contents());
      });
    };
  })(jQuery);

  // prevent underline for linked images
  $('a > img').parent().css({'border-bottom' : 'none'});

  // mark non-body figures created by knitr chunks as 100% width
  $('.layout-chunk').each(function(i, val) {
    var figures = $(this).find('img, .html-widget');
    // ignore leaflet img layers (#106)
    figures = figures.filter(':not(img[class*="leaflet"])')
    if ($(this).attr('data-layout') !== "l-body") {
      figures.css('width', '100%');
    } else {
      figures.css('max-width', '100%');
      figures.filter("[width]").each(function(i, val) {
        var fig = $(this);
        fig.css('width', fig.attr('width') + 'px');
      });

    }
  });

  // auto-append index.html to post-preview links in file: protocol
  // and in rstudio ide preview
  $('.post-preview').each(function(i, val) {
    if (window.location.protocol === "file:")
      $(this).attr('href', $(this).attr('href') + "index.html");
  });

  // get rid of index.html references in header
  if (window.location.protocol !== "file:") {
    $('.distill-site-header a[href]').each(function(i,val) {
      $(this).attr('href', $(this).attr('href').replace(/^index[.]html/, "./"));
    });
  }

  // add class to pandoc style tables
  $('tr.header').parent('thead').parent('table').addClass('pandoc-table');
  $('.kable-table').children('table').addClass('pandoc-table');

  // add figcaption style to table captions
  $('caption').parent('table').addClass("figcaption");

  // initialize posts list
  if (window.init_posts_list)
    window.init_posts_list();

  // implmement disqus comment link
  $('.disqus-comment-count').click(function() {
    window.headroom_prevent_pin = true;
    $('#disqus_thread').toggleClass('hidden');
    if (!$('#disqus_thread').hasClass('hidden')) {
      var offset = $(this).offset();
      $(window).resize();
      $('html, body').animate({
        scrollTop: offset.top - 35
      });
    }
  });
}

document.addEventListener('DOMContentLoaded', function() {
  if (is_downlevel_browser())
    init_downlevel();
  else
    window.addEventListener('WebComponentsReady', init_distill);
});

</script>

<style type="text/css">/* ============================================================
   postcards.css: theme for the postcards::solana pages
   Navy & amber palette with automatic dark mode,
   IBM Plex Sans for reading, Roboto Mono for headings and UI.

   Contents
     1. Fonts and design tokens
     2. Base, links and headings
     3. Header and navigation
     4. Page title block and hero buttons
     5. Components (pills, cards, resources, timeline, software)
     6. Footer
     7. Layout
     8. Motion, print and reduced motion
     9. Blog (currently hidden from the navbar)

   !important is only used where something else forces it: inline
   styles from the postcards template, Bootstrap utility classes, and
   the reduced-motion switch.
   ============================================================ */

/* ============================================================
   1. FONTS AND DESIGN TOKENS
   ============================================================ */
/* Self-hosted (Latin subset, variable fonts): about 100 KB in total instead of the
   1.4 MB of full TTF files that embedding the Google Fonts CSS produced, and no
   request to Google when a page loads. Roboto Mono: Apache 2.0; IBM Plex Sans: SIL OFL 1.1. */
@font-face {
  font-family: 'Roboto Mono';
  font-style: normal;
  font-weight: 300 700;
  font-display: swap;
  src: url(fonts/roboto-mono-latin.woff2) format('woff2');
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}
@font-face {
  font-family: 'IBM Plex Sans';
  font-style: normal;
  font-weight: 400 700;
  font-display: swap;
  src: url(fonts/ibm-plex-sans-latin.woff2) format('woff2');
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}
@font-face {
  font-family: 'IBM Plex Sans';
  font-style: italic;
  font-weight: 400;
  font-display: swap;
  src: url(fonts/ibm-plex-sans-italic-latin.woff2) format('woff2');
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}

/* The postcards template sets its fonts from --body-font, --heading-font and
   --navbar-font, so overriding those variables needs no !important.
   Light values are the default; browsers that support light-dark() get the
   dark palette automatically when the OS prefers it. The toggle in the
   navbar (includes/theme.html) sets data-theme to override the OS setting. */
:root {
  color-scheme: light dark;
  --paper: #f5f2ea;
  --ink: #14213d;
  --header: #14213d;
  --accent: #1d4e89;            /* links: 7.5:1 on --paper */
  --link-hover: #14213d;
  --accent-2: #d98e04;          /* amber: decorative only (bars, stripes, underlines) */
  --muted: #4f5b73;
  --card-bg: rgba(255,255,255,0.6);
  --card-border: rgba(20,33,61,0.12);
  --pill-hover-bg: #14213d;
  --pill-hover-fg: #f5f2ea;
  --body-font: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;   /* picked up by the postcards body rule */
  --font-mono: 'Roboto Mono', monospace;
  --heading-font: 'Roboto Mono', monospace;   /* picked up by the postcards heading rule */
  --navbar-font: 'Roboto Mono', monospace;    /* picked up by the postcards navbar rules */
}
@supports (color: light-dark(black, white)) {
  :root {
    --paper: light-dark(#f5f2ea, #0f1626);
    --ink: light-dark(#14213d, #e8e6df);
    --header: light-dark(#14213d, #0a0f1c);
    --accent: light-dark(#1d4e89, #8fb8f0);
    --link-hover: light-dark(#14213d, #f0b429);
    --accent-2: light-dark(#d98e04, #f0b429);
    --muted: light-dark(#4f5b73, #9aa6bd);
    --card-bg: light-dark(rgba(255,255,255,0.6), rgba(255,255,255,0.05));
    --card-border: light-dark(rgba(20,33,61,0.12), rgba(255,255,255,0.12));
    --pill-hover-bg: light-dark(#14213d, #f0b429);
    --pill-hover-fg: light-dark(#f5f2ea, #0f1626);
  }
}
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"] { color-scheme: dark; }

/* ============================================================
   2. BASE, LINKS AND HEADINGS
   ============================================================ */
html, body {
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  background-color: var(--paper);
  color: var(--ink);
  line-height: 1.65;
  margin: 0;
  padding: 0;
}
body { font-size: 1.05rem; }

/* comfortable reading measure */
p, li { max-width: 72ch; }

/* mono for UI, sans for reading */
.btn, button, input, .list-group-item { font-family: var(--font-mono); }

a, a:visited {
  color: var(--accent);
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 0.18em;
}
a:hover {
  color: var(--link-hover);
  text-decoration-thickness: 2px;
}
a:focus-visible, button:focus-visible, input:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 2px;
}

h1, h2, h3, h4, h5, h6 { color: var(--ink); }   /* family comes from --heading-font */
h1 { font-size: 2.2rem; font-weight: 700; letter-spacing: -0.02em; }
h2 { font-size: 1.6rem; font-weight: 700; letter-spacing: -0.01em; margin-top: 2.25rem; margin-bottom: 0.75rem; }
h3 { font-size: 1.2rem; font-weight: 700; margin-top: 1.5rem; margin-bottom: 0.5rem; }
h4 { font-size: 1.05rem; font-weight: 700; margin-top: 1.25rem; margin-bottom: 0.5rem; }
.section.level2:first-child > h2 { margin-top: 0; }

/* ============================================================
   3. HEADER AND NAVIGATION
   (the nav element is <nav class="distill-site-nav distill-site-header">)
   ============================================================ */
.distill-site-nav.distill-site-header {
  background-color: var(--header);
  color: #fff;
  padding-top: 0.45rem;
  padding-bottom: 0.45rem;
}
.distill-site-header a,
.distill-site-header a:visited {
  color: #fff;
  font-weight: 400;
  letter-spacing: -0.01em;
}
.distill-site-header a.nav-toggle { font-size: 1.6rem; line-height: 1; }
.distill-site-header a.theme-toggle { cursor: pointer; text-decoration: none; font-size: 1.1rem; line-height: 1; }

/* the current page is marked by includes/theme.html */
.distill-site-header .nav-right a[aria-current="page"] {
  text-decoration: underline var(--accent-2) 2px;
  text-underline-offset: 0.45em;
}

/* ============================================================
   4. PAGE TITLE BLOCK AND HERO BUTTONS
   ============================================================ */
/* amber bar under page titles; the inline widths come from the template */
.container hr {
  width: 3rem !important;
  max-width: 3rem !important;
  height: 0;
  margin: 0.6rem 0 1.25rem;
  border: 0;
  border-top: 3px solid var(--accent-2);
  opacity: 1;
}
.d-lg-none hr { margin-left: auto; margin-right: auto; }   /* mobile hero is centred */

/* subpages have no portrait: hide the empty <img> that left a 15rem gap
   under the title and let the title use the full width */
img[src=""] { display: none; }
.row:has(img[src=""]) > .col-7 { flex: 0 0 100%; max-width: 100%; }
/* mobile: the empty image block doubled as spacing under the fixed header
   (Bootstrap's p-3/mt-3 utilities are !important) */
.d-lg-none .p-3:has(> img[src=""]) { height: 5.5rem; margin: 0 !important; padding: 0 !important; }
/* and drop the empty button list under the title */
#icon-list:not(:has(li)),
.list-group:not(:has(a)) { display: none; }

/* desktop social buttons */
#icon-list .list-inline-item { margin-right: 0.25rem; }
#icon-list a, .list-group a { text-decoration: none; }
#icon-list .btn {
  display: inline-block;
  padding: 0.45rem 0.8rem;
  margin: 0 0 0.4rem;
  border: 1px solid var(--ink);
  border-radius: 0.35rem;
  background-color: transparent;
  color: var(--ink);
  font-weight: 500;
  text-decoration: none;
  cursor: pointer;
  transition: transform .12s ease, background-color .12s ease, color .12s ease, opacity .12s ease;
}
#icon-list .btn:hover {
  transform: translateY(-2px);
  opacity: 0.95;
  background-color: var(--pill-hover-bg);
  border-color: var(--pill-hover-bg);
  color: var(--pill-hover-fg);
}
/* mobile social buttons carry inline colours from the template */
.list-group-item {
  background-color: transparent !important;
  color: var(--ink) !important;
  border-color: var(--ink) !important;
}
.list-group-item:hover {
  background-color: var(--pill-hover-bg) !important;
  color: var(--pill-hover-fg) !important;
  border-color: var(--pill-hover-bg) !important;
}

/* ============================================================
   5. COMPONENTS
   ============================================================ */
/* Pill link buttons (downloads, slides, CV) */
a.pill, a.pill:visited {
  display: inline-block;
  padding: 0.3rem 0.8rem;
  border: 1px solid var(--ink);
  border-radius: 0.35rem;
  color: var(--ink);
  font-family: var(--font-mono);
  font-size: 0.85rem;
  font-weight: 500;
  line-height: 1.4;
  text-decoration: none;
  transition: background-color .12s ease, color .12s ease, transform .12s ease;
}
a.pill:hover {
  background-color: var(--pill-hover-bg);
  border-color: var(--pill-hover-bg);
  color: var(--pill-hover-fg);
  transform: translateY(-1px);
}
a.pill.pill-lg { padding: 0.45rem 1.1rem; font-size: 1rem; }

/* Cards: courses, talks, internship offers, publications (title is an h2, h3 or h4) */
.entry {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-left: 4px solid var(--accent-2);
  border-radius: 0.5rem;
  padding: 1.1rem 1.4rem 0.9rem;
  margin: 0 0 1.25rem;
}
.entry > h2, .entry > h3, .entry > h4 { margin-top: 0; font-size: 1.05rem; }
.entry .meta { display: block; margin-bottom: 0.75rem; color: var(--muted); font-family: var(--font-mono); font-size: 0.85rem; }

/* short remark inside a card (e.g. the private-data note on the genomics courses) */
.entry .note p { margin: 0.25rem 0 0.9rem; color: var(--muted); font-size: 0.9rem; }
.entry .note strong { color: var(--ink); }

/* Teaching: one row per resource, label then pill links; .pill-row is a bare row of pills */
.resource { margin: 0.4rem 0; }
.resource p, .pill-row p { display: flex; flex-wrap: wrap; align-items: center; gap: 0.4rem; margin: 0; }
.resource-label { flex: 0 0 15rem; font-family: var(--font-mono); font-weight: 700; font-size: 0.9rem; }

/* Home: education timeline */
.timeline-item {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 0.15rem 1.5rem;
  padding: 0.75rem 0;
  border-top: 1px solid var(--card-border);
}
.timeline-main p, .timeline-dates p { margin: 0; }
.timeline-dates { color: var(--muted); font-family: var(--font-mono); font-size: 0.85rem; }

/* Software: logo beside text, stacked on narrow screens */
.software-item { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 1.25rem; margin-bottom: 1.25rem; }
.software-item img { width: 10rem; max-width: 100%; height: auto; }
.software-text { flex: 1 1 16rem; min-width: 0; }
.software-text > h3 { margin-top: 0; }

@media (max-width: 576px) {
  .resource-label { flex-basis: 100%; }
  .entry { padding: 1rem 1rem 0.75rem; }
}

/* ============================================================
   6. FOOTER (includes/footer.html, emitted at the end of each page)
   ============================================================ */
.site-footer {
  margin-top: 3rem;
  padding: 1.25rem 0 2rem;
  border-top: 1px solid var(--card-border);
  color: var(--muted);
  font-size: 0.85rem;
}
.site-footer p { max-width: none; margin: 0 0 0.35rem; }
.site-footer-name { color: var(--ink); font-family: var(--font-mono); font-weight: 700; }
.site-footer-links a { margin-right: 1.1rem; font-family: var(--font-mono); }
.site-footer-meta a { font-family: var(--font-mono); }

/* ============================================================
   7. LAYOUT: wider column on large screens (cards stay single-column)
   ============================================================ */
@media screen and (min-width: 768px) {
  .container { width: 768px; max-width: 100%; }
}
@media (min-width: 992px) {
  .container { width: 900px; max-width: 100%; }
}

/* ============================================================
   8. MOTION, PRINT AND REDUCED MOTION
   ============================================================ */
/* cross-fade between pages; the header gets its own layer so it stays put */
@view-transition { navigation: auto; }
header.header { view-transition-name: site-header; }

@media (prefers-reduced-motion: no-preference) {
  html { scroll-behavior: smooth; }

  /* cards lift slightly on hover */
  .entry { transition: transform .2s ease, box-shadow .2s ease; }
  .entry:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(20,33,61,0.10); }

  /* amber bar slides in under links on hover */
  .container p a:not(.pill),
  .container li a:not(.pill),
  .site-footer a,
  .distill-site-header .nav-right a:not(.theme-toggle):not(.nav-toggle) {
    background: linear-gradient(var(--accent-2), var(--accent-2)) 0 100% / 0 2px no-repeat;
    transition: background-size .25s ease, color .15s ease;
  }
  .container p a:not(.pill):hover,
  .container li a:not(.pill):hover,
  .site-footer a:hover,
  .distill-site-header .nav-right a:not(.theme-toggle):not(.nav-toggle):hover {
    background-size: 100% 2px;
  }

  /* colours fade when the theme is toggled (!important: beats the component transitions above) */
  .theme-fade, .theme-fade * {
    transition: background-color .3s ease, color .3s ease, border-color .3s ease !important;
  }
}

/* cards and timeline rows fade in as they scroll into view
   (scroll-driven animation: browsers without support just show them) */
@keyframes reveal {
  from { opacity: 0; translate: 0 14px; }
  to   { opacity: 1; translate: 0 0; }
}
@media (prefers-reduced-motion: no-preference) {
  @supports (animation-timeline: view()) {
    .entry, .timeline-item, .software-item {
      animation: reveal linear both;
      animation-timeline: view();
      animation-range: entry 0% entry 35%;
    }
  }
}

/* printing and static captures never scroll, so show everything */
@media print {
  .entry, .timeline-item, .software-item { animation: none; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
  ::view-transition-group(*), ::view-transition-old(*), ::view-transition-new(*) { animation: none !important; }
}

/* ============================================================
   9. BLOG (hidden from the navbar; the listing page is still built)
   ============================================================ */
.blog-intro {
  margin-top: 4rem;      /* space from header */
  margin-bottom: -3rem;  /* space before post listing */
  padding: 0;
  background: transparent;
}</style>
<style type="text/css">
/* base style */

/* FONT FAMILIES */

:root {
